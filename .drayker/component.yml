schema_version: 1
component:
  id: dsupport
  name: Distributed support
  layer: PLATFORM
  artifact_type: architecture
  problem: "A distributed system can decentralize its computers while leaving members without a path to satisfy needs across local and global capacities."
  scope:
    - "Public description of a member-support program and application across multiple levels of need."
    - "Public description of local responses connected to capacities available across the global system."
    - "Public description of material, social, educational, computational, community and other support paths."
    - "Public description of consent, access, qualified-provider boundaries, human review and contestability."
    - "Public description of relation to Dk Personal, UID, Dknowledge, PAP, the Academy, Stations and the capacity economy."
    - "Public description of infrastructure support as one branch: physical and virtual nodes, redundancy, scarcity and audit."
    - "Public separation between needs, infrastructure contribution, contextual reputation, resource units and scarce-capacity priority."
  non_scope:
    - "A deployed support program, application, service network or commitment of resources."
    - "A welfare, health, housing, employment, emergency or benefits service available today."
    - "A guarantee that any individual or category of need will be satisfied."
    - "A deployed payment, reward or compensation scheme for running a node."
    - "Any automatic tradable claim, income or return derived from contributing capacity."
    - "A rule that makes basic-needs support depend on node ownership, Academy history or one reputation score."
  dependencies:
    - personal
    - uid
    - pap
    - dknetwork
    - lc
  implementation:
    level: none
    scope: This repository publishes a charter and open questions; nothing is implemented.
    evidence:
      - type: document
        ref: README.md
  risks:
    - Design language may be mistaken for an available capability.
    - The absence of a specification can leave contributions without a clear target.
  contributions:
    availability: open
    entrypoint: https://github.com/draykerdk/distributed-support/issues
  source_of_truth:
    repository: https://github.com/draykerdk/distributed-support
    path: README.md
  last_reviewed: "2026-08-20"
