schema_version: 1
component:
  id: dsupport
  name: Distributed support
  layer: PLATFORM
  artifact_type: architecture
  problem: "Members, projects, communities and a distributed network all need support without turning need, contribution or reputation into a market in human worth."
  scope:
    - "Public description of support for members, projects and communities as common capacity."
    - "Public description of projects of life and a growing common floor as research directions."
    - "Public description of the relationship with Dk Personal, PAP, Dknowledge, Academy and Stations."
    - "Public description of support nodes, physical and virtual."
    - "Public description of the two tiers of contribution: authenticated nodes and identity-free light contribution."
    - "Public description of redundant computation and comparison as the basis of trust."
    - "Public description of contribution weighted by scarcity rather than volume."
    - "Public description of relation to Dk Network and LCrypt."
    - "Public description of what the network owes a node."
    - "Public description of failure, audit and removal of a node."
  non_scope:
    - "A deployed support network or any commitment of hardware."
    - "A payment, reward or compensation scheme for running a node."
    - "An operating income, benefit, housing, equipment or universal-basic-income programme."
    - "Any tradable claim, income or return derived from contributing capacity."
    - "A score-to-resource pipeline that overrides member-defined rights, needs or accountability."
    - "Biometric intimacy, unverified fixed rates or automatic eligibility treated as requirements."
  dependencies:
    - dknetwork
    - lc
    - daf
    - pap
    - personal
    - dknowledge
  implementation:
    level: none
    scope: This repository publishes the current architectural formulation and open requirements; nothing is implemented.
    evidence:
      - type: document
        ref: README.md
  risks:
    - Design language may be mistaken for an available capability.
    - The absence of a specification can leave contributions without a clear target.
    - Incentive language may be mistaken for a rank of persons or an automatic entitlement.
    - Network support may be mistaken for the whole Support Model, erasing its human and project dimensions.
  contributions:
    availability: open
    entrypoint: https://github.com/draykerdk/distributed-support/issues
  source_of_truth:
    repository: https://github.com/draykerdk/distributed-support
    path: README.md
  last_reviewed: "2026-09-03"
