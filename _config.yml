title: "Distributed support"
description: "The physical side of a network with no data centre. Physical and virtual support, distributed across the people and machines that actually run the network: the machines that hold it up, the people who keep them running, and whatever makes it worth their while to keep doing it.."
remote_theme: draykerdk/drayker-theme
url: "https://support.drayker.org"
dk_kicker: "Support layer"
dk_subdomain: "support.drayker.org"
dk_repo: "https://github.com/draykerdk/distributed-support"

# The mark, drawn by the shared engine. The scope colour is the main accent until the
# mark owner assigns one — DRAYKER-MARK.md §7 forbids inventing a new colour.
dk_body: "hull"
dk_rings: "drydock"
dk_wedge: "shield"
dk_accent: "#FF5500"

# jekyll-remote-theme fetches the shared layout; jekyll-optional-front-matter lets
# README.md render without front matter; the defaults block is what actually applies
# the layout to it. Without all three, GitHub Pages serves bare converted markdown.
plugins:
  - jekyll-remote-theme
  - jekyll-optional-front-matter
  - jekyll-sitemap

defaults:
  - scope:
      path: ""
    values:
      layout: default
dk_sphere: "slate"  # the machines holding it up
